<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zetamach recorder</title>
<style>
  body { width: 280px; margin: 0; padding: 16px; font: 14px/1.45 -apple-system, system-ui, sans-serif; color: #f2f3f5; background: #0b0c10; }
  h1 { margin: 0 0 4px; font-size: 16px; }
  p { margin: 0 0 12px; color: #9a9eab; }
  label { display: block; margin: 0 0 4px; font-size: 13px; color: #c7cad3; }
  input { box-sizing: border-box; width: 100%; margin: 0 0 10px; padding: 8px; font: inherit; color: inherit; background: #15161c; border: 1px solid #3d4050; border-radius: 6px; }
  button { padding: 8px 14px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; color: #1c1100; background: #ffb547; cursor: pointer; }
  button.quiet { color: #f2f3f5; background: #262833; }
  button:disabled { opacity: .6; cursor: default; }
  a { color: #ffb547; }
  .error { color: #ff8a80; }
  [hidden] { display: none; }
</style>
</head>
<body>
  <h1>Zetamach recorder</h1>

  <form id="signed-out" hidden>
    <p>Sign in to save your games on arithmetic.zetamac.com to your Zetamach account.</p>
    <label for="name">Name</label>
    <input id="name" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <p id="error" class="error" role="alert" hidden></p>
    <button id="sign-in" type="submit">Sign in</button>
    <p style="margin-top:12px">No account? <a id="sign-up" target="_blank" rel="noopener">Sign up on Zetamach</a>.</p>
  </form>

  <div id="signed-in" hidden>
    <p>Signed in as <b id="who"></b>. Play on <a href="https://arithmetic.zetamac.com/" target="_blank" rel="noopener">arithmetic.zetamac.com</a> with the default settings at 30 or 120 seconds, and each game saves to your account.</p>
    <p id="waiting" hidden></p>
    <p><a id="progress" target="_blank" rel="noopener">See your progress on Zetamach</a></p>
    <button id="sign-out" class="quiet" type="button">Sign out</button>
  </div>

  <script src="config.js"></script>
  <script src="account.js"></script>
  <script src="popup.js"></script>
</body>
</html>
